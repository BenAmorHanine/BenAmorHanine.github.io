<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanine Ben Amor · AI Engineer</title>
<meta name="description" content="Hanine Ben Amor, final-year engineering student at INSAT in computer vision, RAG, LLMs and multimodal AI. Open to a PFE internship in France.">
<meta property="og:title" content="Hanine Ben Amor · AI Engineer">
<meta property="og:description" content="Computer vision, RAG, LLMs and multimodal AI. Open to a PFE internship in France.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='32' fill='%232B211C'/><circle cx='46' cy='18' r='6' fill='%23D9A889'/><text x='30' y='42' font-family='Georgia,serif' font-style='italic' font-size='28' fill='%23FDFAF7' text-anchor='middle'>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FDFAF7; --card:#FFFFFF; --line:#EFE4DB; --line-2:#E6D6CA;
  --ink:#2B211C; --taupe:#7A5646; --muted:#7A6558;
  --amber:#A8674A; --amber-ink:#7A4A31; --amber-soft:#F4E6DD;
  --tag:#F6EDE6; --hover:#F4E6DD;
  --peach:#F6E3D8; --cream:#F7EDE6;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --wrap:1080px; --nav-h:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* ---------- Navbar ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(246,227,216,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent;transition:border-color .2s;padding-top:env(safe-area-inset-top,0px)}
.nav.scrolled{border-bottom-color:var(--line);background:rgba(253,250,247,.86)}
.nav-in{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--serif);font-size:22px;text-decoration:none;white-space:nowrap}
.brand i{color:var(--amber);font-style:normal}
.links{display:flex;align-items:center;gap:4px;list-style:none;margin:0;padding:0}
.links a{display:block;text-decoration:none;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:999px;transition:color .15s,background .15s}
.links a:hover{color:var(--ink)}
.links a.active{color:var(--ink);background:rgba(255,255,255,.7)}
.nav-actions{display:flex;align-items:center;gap:8px}
.lang{font:500 13px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:6px 11px;cursor:pointer}
.lang:hover{border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--sans);text-decoration:none;background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:999px;padding:9px 18px;white-space:nowrap;cursor:pointer;transition:background .15s}
.pill:hover{background:#45362F}
.pill svg{width:14px;height:14px}
.pill.sm{padding:7px 14px;font-size:13px}
.burger{display:none;background:none;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font:500 13px var(--sans);color:var(--ink);cursor:pointer}

/* ---------- Hero ---------- */
.hero{position:relative;overflow:hidden;text-align:center;padding:72px 0 64px;background:linear-gradient(180deg,var(--peach) 0%,var(--cream) 55%,var(--paper) 100%)}
.arcs{position:absolute;left:50%;top:56%;transform:translateX(-50%);width:2200px;height:900px;pointer-events:none}
.hero .wrap{position:relative}
.avatar{width:120px;height:120px;border-radius:50%;margin:0 auto 28px;background:#EAD6C8;border:4px solid var(--card);box-shadow:0 0 0 1px var(--line-2);overflow:hidden;display:flex;align-items:center;justify-content:center;font:italic 40px var(--serif);color:var(--taupe)}
.avatar img{width:100%;height:100%;object-fit:cover}
.status{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0}
.status .dot{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(168,103,74,.45)}50%{box-shadow:0 0 0 6px rgba(168,103,74,0)}}
.h1{font-size:clamp(44px,8.4vw,96px);font-weight:500;letter-spacing:-.035em;line-height:1;margin:22px 0 0}
.h1b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(32px,5.8vw,68px);letter-spacing:-.01em;line-height:1.08;color:var(--taupe);margin:6px 0 0}
.intro{max-width:600px;margin:28px auto 0;font-size:17px;line-height:1.75;color:var(--muted)}
.ctas{display:flex;flex-wrap:wrap;gap:14px 26px;justify-content:center;align-items:center;margin-top:36px}
.contact .ctas{justify-content:center}
.ctas .pill{padding:14px 26px;font-size:15px}
.textlink{display:inline-flex;align-items:center;gap:10px;font-weight:500;font-size:15px;text-decoration:none}
.textlink svg{width:16px;height:16px;transition:transform .2s}
.textlink:hover svg{transform:translateX(3px)}
.note{margin-top:22px;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.note svg{width:14px;height:14px}

/* entrance: one moment, hero only */
.rise{opacity:0;transform:translateY(12px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}.rise.d3{animation-delay:.24s}.rise.d4{animation-delay:.32s}.rise.d5{animation-delay:.4s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}.status .dot{animation:none}html{scroll-behavior:auto}}

/* ---------- Highlights ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:26px 22px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;line-height:1;letter-spacing:-.01em}
.stat span{display:block;margin-top:10px;font-size:13.5px;line-height:1.5;color:var(--muted)}

/* ---------- Sections ---------- */
section.block{padding:88px 0 0}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:baseline;margin-bottom:32px}
.sec-title{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;margin:0;display:flex;align-items:center;gap:12px}
.sec-title .dot{width:6px;height:6px}
.grid-2{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}

/* About */
.about p{margin:0 0 16px;font-size:17px;line-height:1.75;max-width:680px}
.about p:first-child{font-size:19px;color:var(--ink)}
.about p+p{color:var(--taupe)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin-top:28px;border-top:1px solid var(--line)}
.fact{padding:14px 0;border-bottom:1px solid var(--line)}
.fact:nth-child(odd){padding-right:20px}
.fact dt{font-size:12.5px;color:var(--muted)}
.fact dd{margin:2px 0 0;font-size:15px;font-weight:500}

/* Experience timeline */
.exp{list-style:none;margin:0;padding:0}
.job{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:30px 0;border-top:1px solid var(--line)}
.job:last-child{border-bottom:1px solid var(--line)}
.job-when{font-size:14px;color:var(--muted);line-height:1.5}
.job-when .place{display:block;margin-top:4px;font-size:13px}
.job h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.job .org{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--taupe);margin-top:2px}
.job ul{margin:14px 0 0;padding:0;list-style:none;max-width:700px}
.job li{position:relative;padding-left:18px;margin:8px 0;font-size:15.5px;line-height:1.65;color:#3E312A}
.job li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:1.5px;background:var(--amber)}
.phase{margin-top:18px}
.phase-name{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-weight:500;font-size:15px}
.phase-name small{font-size:13px;color:var(--muted);font-weight:400}
.phase ul{margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-size:12.5px;color:#6B5448;background:var(--tag);border-radius:999px;padding:4px 11px}

/* Projects */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column}
.proj:first-child,.proj:nth-child(2n):last-child{grid-column:1/-1}
.proj .badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--amber-ink);background:var(--amber-soft);border-radius:999px;padding:4px 11px;margin-bottom:14px}
.proj .badge .dot{width:5px;height:5px}
.proj h3{margin:0;font-family:var(--serif);font-weight:400;font-size:27px;line-height:1.2}
.proj p{margin:12px 0 0;font-size:15px;line-height:1.7;color:var(--taupe);max-width:720px}
.proj .tags{margin-top:auto;padding-top:18px}
.proj-link{margin-top:16px;align-self:flex-start;font-size:14px}
.job .proj-link{display:inline-flex}

/* Skills */
.skills{border-top:1px solid var(--line)}
.skill-row{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.skill-row h3{margin:0;font-size:15px;font-weight:500}
.skill-row .tags{margin:0}

/* Education */
.edu-list{border-top:1px solid var(--line)}
.edu{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:20px 0;border-bottom:1px solid var(--line)}
.edu .when{font-size:14px;color:var(--muted)}
.edu h3{margin:0;font-size:17px;font-weight:600}
.edu .school{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--taupe)}
.edu p{margin:8px 0 0;font-size:14.5px;color:var(--muted);max-width:680px}
.sub-title{font-size:15px;font-weight:600;margin:40px 0 14px}
.certs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cert{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.cert b{display:block;font-size:15px;font-weight:500;line-height:1.4}
.cert span{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.activity{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.activity b{font-weight:500}
.activity small{color:var(--muted);margin-left:8px}
.activity p{margin:6px 0 0;font-size:14.5px;color:var(--taupe);max-width:760px}

/* Contact */
.contact{margin:104px 0 0;text-align:center;position:relative;overflow:hidden;padding:88px 24px 96px;background:linear-gradient(0deg,var(--peach) 0%,var(--cream) 50%,var(--paper) 100%)}
.contact h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(40px,6vw,68px);line-height:1.05;margin:18px 0 0}
.contact p{max-width:560px;margin:18px auto 0;color:var(--muted);font-size:16px}
.contact .ctas{margin-top:30px}
.ghost{display:inline-flex;align-items:center;gap:8px;font:500 14px var(--sans);background:transparent;color:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:13px 20px;cursor:pointer;text-decoration:none}
.ghost:hover{border-color:var(--ink)}
.socials{display:flex;justify-content:center;gap:10px;margin-top:26px}
.socials a{display:inline-flex;align-items:center;gap:8px;font-size:14px;text-decoration:none;color:var(--taupe);padding:8px 14px;border-radius:999px}
.socials a:hover{color:var(--ink);background:var(--hover)}
.socials svg{width:16px;height:16px}
.name-links{display:flex;justify-content:center;gap:6px;margin:12px 0 2px}
.name-links a{display:inline-flex;align-items:center;gap:7px;font-size:14px;text-decoration:none;color:var(--taupe);padding:6px 14px;border-radius:999px;transition:background .15s,color .15s}
.name-links a:hover{color:var(--ink);background:rgba(255,255,255,.7)}
.name-links svg{width:16px;height:16px}
footer{background:var(--peach);border-top:1px solid #EFD9CB;padding:24px 0 calc(24px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .links{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 16px 16px;display:none}
  .links.open{display:flex}
  .links a{padding:12px 10px;border-radius:10px;font-size:15px}
  .burger{display:inline-block}
}
@media (max-width:760px){
  .wrap{padding:0 20px}
  .hero{padding:48px 0 48px}
  .avatar{width:104px;height:104px}
  .status{font-size:11px;letter-spacing:.1em;max-width:300px}
  .stat{padding:20px 14px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:none}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat b{font-size:32px}
  section.block{padding-top:64px}
  .sec-head,.grid-2,.job,.skill-row,.edu{grid-template-columns:1fr;gap:8px}
  .sec-title{font-size:34px}
  .facts{grid-template-columns:1fr}
  .fact:nth-child(odd){padding-right:0}
  .projects{grid-template-columns:1fr}
  .certs{grid-template-columns:1fr}
  .nav .pill.sm span{display:none}
  .brand{font-size:20px}
}
@media print{.nav,.toast,.arcs{display:none}.rise{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="wrap nav-in">
    <a class="brand" href="#top">Hanine Ben Amor<i>.</i></a>
    <nav aria-label="Main">
      <ul class="links" id="links"></ul>
    </nav>
    <div class="nav-actions">
      <button class="lang" id="langBtn" type="button" aria-label="Switch language">FR</button>
      <a class="pill sm" id="navCv" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
        <span id="navCvLabel">Download CV</span>
      </a>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="links">Menu</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <svg class="arcs" viewBox="0 0 2200 900" fill="none" aria-hidden="true">
      <ellipse cx="1100" cy="620" rx="1080" ry="560" stroke="#EAD3C4"/>
      <ellipse cx="1100" cy="700" rx="1000" ry="560" stroke="#F0E0D5"/>
    </svg>
    <div class="wrap" id="hero"></div>
  </section>

  <div class="wrap">
    <div class="stats" id="stats"></div>
    <section class="block" id="about"></section>
    <section class="block" id="experience"></section>
    <section class="block" id="projects"></section>
    <section class="block" id="skills"></section>
    <section class="block" id="education"></section>
  </div>

  <section class="contact" id="contact"></section>
</main>

<footer><div class="wrap"><span id="copy"></span><span id="footnote"></span></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="content.js"></script>
<script>
(function(){
  const S = window.SITE;
  if (!S) { document.getElementById("hero").innerHTML = '<p class="intro">content.js is missing. Upload it next to index.html.</p>'; return; }
  const ICON = {
    down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6l6 6-6 6"/></svg>',
    out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>',
    pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    in:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.05c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.78 2.65 4.78 6.1V21h-4v-5.1c0-1.22-.02-2.8-1.7-2.8-1.72 0-1.98 1.34-1.98 2.71V21h-4z"/></svg>',
    gh:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.46-1.1-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>'
  };
  const SECTIONS = ["about","experience","projects","skills","education","contact"];
  const tags = a => a && a.length ? `<div class="tags">${a.map(t=>`<span class="tag">${t}</span>`).join("")}</div>` : "";
  const bullets = a => `<ul>${a.map(b=>`<li>${b}</li>`).join("")}</ul>`;
  const head = t => `<div class="sec-head"><h2 class="sec-title"><span class="dot"></span>${t}</h2></div>`;

  function pickLang(){
    const q = new URLSearchParams(location.search).get("lang");
    if (q === "fr" || q === "en") return q;
    try { const s = localStorage.getItem("lang"); if (s === "fr" || s === "en") return s; } catch(e){}
    return (navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en";
  }
  let lang = pickLang();

  function render(){
    const T = S[lang];
    document.documentElement.lang = lang;
    document.getElementById("langBtn").textContent = lang === "en" ? "FR" : "EN";
    document.getElementById("langBtn").setAttribute("aria-label", lang === "en" ? "Passer en français" : "Switch to English");
    document.getElementById("burger").textContent = T.nav.menu;
    const cv = S.cv[lang];
    const navCv = document.getElementById("navCv");
    navCv.href = cv; document.getElementById("navCvLabel").textContent = T.nav.cv;

    document.getElementById("links").innerHTML = SECTIONS.map(id=>`<li><a href="#${id}" data-id="${id}">${T.nav[id]}</a></li>`).join("");

    const H = T.hero;
    document.getElementById("hero").innerHTML = `
      <div class="avatar rise" id="avatar"><span>${S.initials}</span></div>
      <div class="status rise d1"><span class="dot"></span>${H.status}</div>
      <h1 class="h1 rise d2">${H.title}</h1>
      <div class="name-links rise d2"><a href="${S.github}" target="_blank" rel="noopener">${ICON.gh} GitHub</a><a href="${S.linkedin}" target="_blank" rel="noopener">${ICON.in} LinkedIn</a></div>
      <p class="h1b rise d2">${H.tagline}</p>
      <p class="intro rise d3">${H.intro}</p>
      <div class="ctas rise d4">
        <a class="pill" href="${cv}" target="_blank" rel="noopener">${H.cta1} ${ICON.down}</a>
        <a class="textlink" href="#experience">${H.cta2} ${ICON.arrow}</a>
        <a class="textlink" href="#projects">${H.cta3} ${ICON.arrow}</a>
      </div>
      <p class="note rise d5">${ICON.pin}${H.note}</p>`;
    loadPhoto();

    document.getElementById("stats").innerHTML = T.highlights.map(h=>`<div class="stat"><b>${h.value}</b><span>${h.label}</span></div>`).join("");

    const A = T.about;
    document.getElementById("about").innerHTML = `
      <div class="grid-2">
        <h2 class="sec-title"><span class="dot"></span>${A.title}</h2>
        <div class="about">
          ${A.text.map(p=>`<p>${p}</p>`).join("")}
          <dl class="facts">${A.facts.map(f=>`<div class="fact"><dt>${f.k}</dt><dd>${f.v}</dd></div>`).join("")}</dl>
        </div>
      </div>`;

    const E = T.experience;
    document.getElementById("experience").innerHTML = head(E.title) + `<ol class="exp">${E.items.map(j=>`
      <li class="job">
        <div class="job-when">${j.dates}<span class="place">${j.place}</span></div>
        <div>
          <h3>${j.role}</h3>
          <div class="org">${j.org}</div>
          ${j.bullets ? bullets(j.bullets) : ""}
          ${j.phases ? j.phases.map(p=>`<div class="phase"><div class="phase-name">${p.name}<small>${p.dates}</small></div>${bullets(p.bullets)}</div>`).join("") : ""}
          ${tags(j.tags)}
          ${j.link ? `<a class="textlink proj-link" href="${j.link}" target="_blank" rel="noopener">${E.linkLabel} ${ICON.out}</a>` : ""}
        </div>
      </li>`).join("")}</ol>`;

    const P = T.projects;
    document.getElementById("projects").innerHTML = head(P.title) + `<div class="projects">${P.items.map(p=>`
      <article class="proj">
        ${p.badge ? `<span class="badge"><span class="dot"></span>${p.badge}</span>` : ""}
        <h3>${p.title}</h3>
        <p>${p.text}</p>
        ${tags(p.tags)}
        ${p.link ? `<a class="textlink proj-link" href="${p.link}" target="_blank" rel="noopener">${P.linkLabel} ${ICON.out}</a>` : ""}
      </article>`).join("")}</div>`;

    const K = T.skills;
    document.getElementById("skills").innerHTML = head(K.title) + `<div class="skills">${K.groups.map(g=>`
      <div class="skill-row"><h3>${g.name}</h3>${tags(g.items)}</div>`).join("")}</div>`;

    const D = T.education;
    document.getElementById("education").innerHTML = head(D.title) + `
      <div class="edu-list">${D.items.map(e=>`
        <div class="edu"><div class="when">${e.dates}</div><div><h3>${e.degree}</h3><div class="school">${e.school}</div>${e.detail?`<p>${e.detail}</p>`:""}</div></div>`).join("")}
      </div>
      <h3 class="sub-title">${D.certTitle}</h3>
      <div class="certs">${D.certs.map(c=>`<div class="cert"><b>${c.name}</b><span>${c.org}, ${c.year}</span></div>`).join("")}</div>
      <h3 class="sub-title">${D.activityTitle}</h3>
      ${D.activities.map(a=>`<div class="activity"><b>${a.role}</b><small>${a.dates}</small><p>${a.text}</p></div>`).join("")}`;

    const C = T.contact;
    document.getElementById("contact").innerHTML = `
      <div class="status"><span class="dot"></span>${T.nav.contact}</div>
      <h2>${C.title}</h2>
      <p>${C.text}</p>
      <div class="ctas">
        <a class="pill" href="mailto:${S.email}">${ICON.mail} ${C.email}</a>
        <button class="ghost" type="button" id="copyEmail">${S.email}</button>
      </div>
      <div class="socials">
        <a href="${S.linkedin}" target="_blank" rel="noopener">${ICON.in} LinkedIn</a>
        <a href="${S.github}" target="_blank" rel="noopener">${ICON.gh} GitHub</a>
        <a href="${cv}" target="_blank" rel="noopener">${ICON.down} CV</a>
      </div>`;
    document.getElementById("copyEmail").setAttribute("aria-label", C.copy);
    document.getElementById("copyEmail").onclick = () => {
      const done = () => toast(C.copied);
      if (navigator.clipboard) navigator.clipboard.writeText(S.email).then(done, ()=>{}); 
    };

    document.getElementById("copy").textContent = `© ${new Date().getFullYear()} ${S.name}`;
    document.getElementById("footnote").textContent = T.footer;
    document.title = lang === "fr" ? `${S.name} · Ingénieure IA` : `${S.name} · AI Engineer`;
    observe();
  }

  function loadPhoto(){
    const img = new Image();
    img.alt = S.name;
    img.onload = () => { const a = document.getElementById("avatar"); if (a){ a.innerHTML = ""; a.appendChild(img);} };
    img.src = S.photo;
  }

  function toast(msg){
    const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
  }

  let io;
  function observe(){
    if (io) io.disconnect();
    const links = [...document.querySelectorAll(".links a")];
    io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ links.forEach(l=>l.classList.toggle("active", l.dataset.id === e.target.id)); } });
    }, { rootMargin: "-45% 0px -50% 0px" });
    SECTIONS.forEach(id=>{ const el = document.getElementById(id); if (el) io.observe(el); });
    links.forEach(l=>l.addEventListener("click", closeMenu));
  }

  const burger = document.getElementById("burger"), linksEl = document.getElementById("links");
  function closeMenu(){ linksEl.classList.remove("open"); burger.setAttribute("aria-expanded","false"); }
  burger.onclick = () => { const o = linksEl.classList.toggle("open"); burger.setAttribute("aria-expanded", String(o)); };

  document.getElementById("langBtn").onclick = () => {
    lang = lang === "en" ? "fr" : "en";
    try { localStorage.setItem("lang", lang); } catch(e){}
    render();
    document.querySelectorAll(".rise").forEach(el=>{ el.style.animation = "none"; el.style.opacity = 1; el.style.transform = "none"; });
  };

  const nav = document.getElementById("nav");
  addEventListener("scroll", () => nav.classList.toggle("scrolled", scrollY > 8), { passive: true });

  render();
})();
</script>
</body>
</html>
